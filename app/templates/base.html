<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ business }} — админка</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#6b7686; --line:#e3e7ee; --accent:#2f6fed; --danger:#d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212c; --text:#e8ecf3; --muted:#93a0b4; --line:#2a3342; --accent:#6c9bff; --danger:#ff7b7b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:0 16px; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:4px; align-items:center; flex-wrap:wrap; max-width:960px; margin:0 auto; }
  nav strong { margin-right:16px; padding:12px 0; }
  nav a { color:var(--muted); text-decoration:none; padding:12px 10px; border-bottom:2px solid transparent; }
  nav a.on { color:var(--text); border-color:var(--accent); }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  tr:last-child td { border-bottom:0; }
  .muted { color:var(--muted); }
  form.inline { display:inline; margin:0; }
  form.row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  input, select { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); }
  button { font:inherit; padding:7px 12px; border:0; border-radius:7px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .off { opacity:.55; }
  .hours { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
  .hours form { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:7px; padding:2px 4px 2px 8px; }
  .hours button { padding:0 6px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi b { display:block; font-size:22px; line-height:1.3; }
  .kpi span { color:var(--muted); font-size:13px; }
  .period { display:flex; gap:6px; margin-bottom:12px; }
  .period a { color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:99px; padding:3px 12px; }
  .period a.on { color:var(--text); border-color:var(--accent); }
  h2 { font-size:16px; margin:0 0 8px; }
  .num { text-align:right; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <nav>
    <strong>{{ business }}</strong>
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">Записи</a>
    <a href="/past" class="{{ 'on' if request.url.path == '/past' }}">Прошедшие</a>
    <a href="/stats" class="{{ 'on' if request.url.path == '/stats' }}">Статистика</a>
    <a href="/clients" class="{{ 'on' if request.url.path == '/clients' }}">Клиенты</a>
    <a href="/services" class="{{ 'on' if request.url.path == '/services' }}">Услуги</a>
    <a href="/masters" class="{{ 'on' if request.url.path == '/masters' }}">Мастера</a>
  </nav>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
